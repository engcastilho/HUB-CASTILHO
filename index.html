<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub Castilho</title>
  <meta name="description" content="Quem sou, minha formação e meus links.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hub">
    <header class="perfil">
      <div class="avatar" id="avatar"></div>
      <h1 id="nome"></h1>
      <p class="titulo" id="titulo"></p>
      <p class="local" id="local"></p>
      <p class="bio" id="bio"></p>
    </header>

    <nav class="links" id="links" aria-label="Links"></nav>

    <section class="bloco" id="bloco-formacao">
      <h2>Formação</h2>
      <ul class="formacao" id="formacao"></ul>
    </section>

    <section class="bloco" id="bloco-areas">
      <h2>Áreas de atuação</h2>
      <ul class="areas" id="areas"></ul>
    </section>

    <footer class="rodape" id="rodape"></footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
